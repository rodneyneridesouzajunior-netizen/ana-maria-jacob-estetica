[functions.painel-fichas]
enabled = true
# verify_jwt=false somente porque a Edge valida internamente o Bearer no Auth,
# a sessão ativa, o vínculo owner e AAL2. Não habilita acesso anônimo/legado.
verify_jwt = false
import_map = "./functions/painel-fichas/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/painel-fichas/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/painel-fichas/*.html" ]

[functions.agenda-fichas]
enabled = true
# Validação interna obrigatória: Bearer, sessão ativa, owner e AAL2.
verify_jwt = false
import_map = "./functions/agenda-fichas/deno.json"
entrypoint = "./functions/agenda-fichas/index.ts"

[functions.anamnese-submit]
enabled = true
# Formulário público de paciente: não há conta Auth. A função aplica CORS,
# honeypot, limite de corpo, validação clínica, rate limit e idempotência.
verify_jwt = false
import_map = "./functions/anamnese-submit/deno.json"
entrypoint = "./functions/anamnese-submit/index.ts"

[functions.financeiro-fichas]
enabled = true
# JWT é validado no corpo para também exigir sessão ativa, owner e AAL2.
# Senha compartilhada legada é recusada explicitamente neste endpoint.
verify_jwt = false
import_map = "./functions/financeiro-fichas/deno.json"
entrypoint = "./functions/financeiro-fichas/index.ts"

[functions.prontuario-fichas]
enabled = true
# Validação interna obrigatória: Bearer, sessão ativa, owner e AAL2.
verify_jwt = false
import_map = "./functions/prontuario-fichas/deno.json"
entrypoint = "./functions/prontuario-fichas/index.ts"

[functions.operacao-clinica-fichas]
enabled = true
# Validação interna obrigatória: Bearer, sessão ativa, owner e AAL2.
verify_jwt = false
import_map = "./functions/operacao-clinica-fichas/deno.json"
entrypoint = "./functions/operacao-clinica-fichas/index.ts"

[functions.crm-fichas]
enabled = true
# Validação interna obrigatória: Bearer, sessão ativa, owner e AAL2.
# Arquivamento e conversão final também consomem prova recente de senha.
verify_jwt = false
import_map = "./functions/crm-fichas/import_map.json"
entrypoint = "./functions/crm-fichas/index.ts"

[functions.agendamento-submit]
enabled = true
# Formulário público sem conta Auth. A Edge restringe origem, tamanho, campos,
# tempo de preenchimento, rate limit atômico e idempotência antes da RPC privada.
verify_jwt = false
import_map = "./functions/agendamento-submit/deno.json"
entrypoint = "./functions/agendamento-submit/index.ts"

[functions.app-workspace]
enabled = true
# Internal Auth validation requires Bearer, active session, owner and AAL2.
# The gateway JWT check is disabled only to use this verified custom flow.
verify_jwt = false
entrypoint = "./functions/app-workspace/index.ts"

[functions.documento-paciente]
enabled = true
# Individual expiring/revocable capability; no anonymous table/RPC permissions.
verify_jwt = false
import_map = "./functions/documento-paciente/deno.json"
entrypoint = "./functions/documento-paciente/index.ts"

[functions.foto-marcacoes-fichas]
enabled = true
verify_jwt = false
entrypoint = "./functions/foto-marcacoes-fichas/index.ts"

